#YAML
# ═══════════════════════════════════════════════════════════════════════════════
# QTE Stratified Tier 1 — EWMAC + CARRY, long-history instruments (20+ years)
#
# Same 5 instruments as Tier 1 EWMAC, but adds CARRY rule at 38% weight.
# ═══════════════════════════════════════════════════════════════════════════════

trading_rules:
  ewmac8_32:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 8
      Lslow: 32
    forecast_scalar: 5.3

  ewmac16_64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 16
      Lslow: 64
    forecast_scalar: 3.75

  ewmac32_128:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 32
      Lslow: 128
    forecast_scalar: 2.65

  ewmac64_256:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 64
      Lslow: 256
    forecast_scalar: 1.87

  carry:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 90
    forecast_scalar: 30

forecast_cap: 20.0

# EWMAC 62% + CARRY 38% (same split as Q)
forecast_weights:
  ewmac8_32:   0.100
  ewmac16_64:  0.173
  ewmac32_128: 0.173
  ewmac64_256: 0.173
  carry:       0.380

forecast_div_multiplier: 1.5

percentage_vol_target: 15.0
notional_trading_capital: 500000
base_currency: "USD"

instrument_weights:
  SP500_micro:  0.20
  NASDAQ_micro: 0.15
  US10:         0.30
  EUR_micro:    0.20
  SILVER:       0.15

instrument_div_multiplier: 1.4
